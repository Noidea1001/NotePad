[package]
name = "noteworkspace-desktop"
version = "1.0.0"
description = "Production-grade Local-First Workspace for Developers and Teams"
authors = ["NoteWorkspace Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.0.0"
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
